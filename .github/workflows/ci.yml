name: CI/CD

on:
  pull_request:
    branches: [ main, master, develop ]
  push:
    branches: [ main, master ]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - os: ubuntu-latest
            build_type: Debug
            coverage: true
            package_generator: DEB
          - os: ubuntu-latest
            build_type: Release
            coverage: false
            package_generator: DEB
          # macOS
          - os: macos-latest
            build_type: Debug
            coverage: false
            package_generator: DragNDrop
          - os: macos-latest
            build_type: Release
            coverage: false
            package_generator: DragNDrop
          # Windows
          - os: windows-latest
            build_type: Debug
            coverage: false
            package_generator: NSIS
          - os: windows-latest
            build_type: Release
            coverage: false
            package_generator: NSIS

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / ${{ matrix.build_type }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Linux dependencies ──
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            qt6-base-dev \
            libqt6opengl6-dev \
            qt6-base-private-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libglew-dev \
            libboost-all-dev \
            libfftw3-dev \
            libgsl-dev
          # Coverage tools
          if [ "${{ matrix.coverage }}" = "true" ]; then
            sudo apt-get install -y --no-install-recommends lcov
          fi

      # ── macOS dependencies ──
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install \
            cmake \
            ninja \
            qt@6 \
            glew \
            boost \
            fftw \
            gsl
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@6);$(brew --prefix boost)" >> $GITHUB_ENV

      # ── Windows dependencies (vcpkg) ──
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install qtbase qttools glew boost-thread boost-date-time boost-regex boost-filesystem boost-system boost-program-options fftw3 gsl --triplet x64-windows

      # ── Configure ──
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake_args=(
            -B build
            -G Ninja
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
            -DUSE_QT6=ON
            -DDISABLE_CGAL=ON
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install
          )
          if [ "${{ matrix.coverage }}" = "true" ]; then
            cmake_args+=(
              -DCMAKE_C_FLAGS="--coverage -fprofile-arcs -ftest-coverage"
              -DCMAKE_CXX_FLAGS="--coverage -fprofile-arcs -ftest-coverage"
              -DCMAKE_EXE_LINKER_FLAGS="--coverage"
              -DCMAKE_SHARED_LINKER_FLAGS="--coverage"
            )
          fi
          cmake "${cmake_args[@]}"

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DUSE_QT6=ON \
            -DDISABLE_CGAL=ON \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DUSE_QT6=ON `
            -DDISABLE_CGAL=ON `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install"

      # ── Build ──
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      # ── Test ──
      # VolumeRover does not currently have a formal test suite.
      # When tests are added, enable the step below.
      # - name: Run tests
      #   run: ctest --test-dir build --build-config ${{ matrix.build_type }} --output-on-failure --parallel

      # ── Coverage (Linux Debug only) ──
      - name: Generate coverage report
        if: matrix.coverage
        run: |
          lcov --directory build --capture --output-file build/coverage.info --ignore-errors mismatch
          lcov --remove build/coverage.info \
            '/usr/*' \
            '*/test/*' \
            '*/tests/*' \
            '*/_deps/*' \
            --output-file build/coverage_filtered.info
          genhtml build/coverage_filtered.info \
            --output-directory build/coverage_html \
            --title "VolumeRover Code Coverage" \
            --legend \
            --demangle-cpp \
            --ignore-errors source

      - name: Upload coverage report
        if: matrix.coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage_html/
          retention-days: 30

      - name: Upload coverage to Codecov
        if: matrix.coverage
        uses: codecov/codecov-action@v4
        with:
          files: build/coverage_filtered.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # ── Install ──
      - name: Install
        run: cmake --install build --config ${{ matrix.build_type }}

      # ── Package ──
      - name: Package
        working-directory: build
        run: cpack -G ${{ matrix.package_generator }} -C ${{ matrix.build_type }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}-${{ matrix.build_type }}
          path: |
            build/*.deb
            build/*.dmg
            build/*.exe
            build/*.zip
            build/*.tar.gz
          retention-days: 30

      # ── Build artifact (installed tree) ──
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}-${{ matrix.build_type }}
          path: ${{ github.workspace }}/install/
          retention-days: 14
