name: CI/CD

on:
  pull_request:
    branches: [ main, master, develop ]
  push:
    branches: [ main, master ]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - os: ubuntu-latest
            build_type: Debug
            package_generator: DEB
          - os: ubuntu-latest
            build_type: Release
            package_generator: DEB
          # macOS
          - os: macos-latest
            build_type: Debug
            package_generator: DragNDrop
          - os: macos-latest
            build_type: Release
            package_generator: DragNDrop
          # Windows
          - os: windows-latest
            build_type: Debug
            package_generator: NSIS
          - os: windows-latest
            build_type: Release
            package_generator: NSIS

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / ${{ matrix.build_type }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── libcvc-deps prebuilt bundle ──
      # Pulls a self-contained CMake prefix (Boost, HDF5, FFTW, GSL,
      # log4cplus, CGAL, ImageMagick, Qt 6) matching the runner OS,
      # arch, and build_type. Massive speedup on Windows where vcpkg
      # otherwise compiles Boost from source. On miss the action emits
      # an empty `path` output and we fall back to the platform package
      # manager path.
      - name: Fetch libcvc-deps
        id: libcvc-deps
        uses: transfix/libcvc/.github/actions/fetch-libcvc-deps@ci/fetch-libcvc-deps-7z
        with:
          version: '1.1.0'
          build_type: ${{ matrix.build_type }}
          link: shared

      # Make bundled Qt 6 host tools (uic, moc, rcc) able to load
      # their shared libraries at build time. The bundle's
      # libexec/uic links against libQt6Core.so/.dylib in the bundle's
      # lib/, which isn't on the runner's default loader path.
      - name: Export Qt runtime lib path (Linux/macOS)
        if: runner.os != 'Windows' && steps.libcvc-deps.outputs.path != ''
        shell: bash
        run: |
          deps='${{ steps.libcvc-deps.outputs.path }}'
          echo "LD_LIBRARY_PATH=$deps/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$deps/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "DYLD_FALLBACK_LIBRARY_PATH=$deps/lib${DYLD_FALLBACK_LIBRARY_PATH:+:$DYLD_FALLBACK_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Export Qt runtime DLL path (Windows)
        if: runner.os == 'Windows' && steps.libcvc-deps.outputs.path != ''
        shell: pwsh
        run: |
          $deps = '${{ steps.libcvc-deps.outputs.path }}'
          "$deps\bin" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      # ── Linux dependencies ──
      # System-only essentials always installed; bundled libs (Boost,
      # HDF5, FFTW, GSL, log4cplus, CGAL, ImageMagick, Qt 6) skipped
      # when libcvc-deps is available.
      - name: Install dependencies (Linux, system)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libglew-dev \
            libnsl-dev \
            nvidia-cg-toolkit \
            imagemagick

      - name: Install dependencies (Linux, fallback)
        if: runner.os == 'Linux' && steps.libcvc-deps.outputs.path == ''
        run: |
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev \
            libqt6opengl6-dev \
            qt6-base-private-dev \
            libboost-all-dev \
            libfftw3-dev \
            libgsl-dev \
            libhdf5-dev \
            libcgal-dev \
            liblog4cplus-dev \
            libmagick++-dev

      # ── macOS dependencies ──
      - name: Install dependencies (macOS, system)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja glew

      - name: Install dependencies (macOS, fallback)
        if: runner.os == 'macOS' && steps.libcvc-deps.outputs.path == ''
        run: |
          brew install \
            qt@6 \
            boost \
            fftw \
            gsl \
            hdf5 \
            cgal \
            log4cplus \
            imagemagick
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@6);$(brew --prefix boost);$(brew --prefix log4cplus)" >> $GITHUB_ENV

      # ── Windows dependencies ──
      # On libcvc-deps hit: skip both install-qt-action and the heavy
      # vcpkg install (Boost from source ~20 min). On miss: full path.
      - name: Install Qt (Windows)
        if: runner.os == 'Windows' && steps.libcvc-deps.outputs.path == ''
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64
          cache: true

      - name: Install dependencies (Windows, fallback)
        if: runner.os == 'Windows' && steps.libcvc-deps.outputs.path == ''
        run: |
          vcpkg install glew fftw3 gsl hdf5[cpp] cgal log4cplus pthreads boost-thread boost-date-time boost-regex boost-filesystem boost-system boost-program-options boost-signals2 boost-any boost-tuple boost-format boost-multi-array boost-foreach boost-property-tree boost-algorithm boost-asio boost-bind boost-graph boost-lambda boost-lexical-cast boost-spirit boost-tokenizer boost-dynamic-bitset boost-numeric-conversion boost-range boost-smart-ptr boost-functional --triplet x64-windows
        env:
          VCPKG_MAX_CONCURRENCY: 4

      # GLEW + pthreads aren't in the libcvc-deps bundle, so install
      # them via vcpkg unconditionally on Windows.
      - name: Install GLEW + pthreads (Windows, libcvc-deps hit)
        if: runner.os == 'Windows' && steps.libcvc-deps.outputs.path != ''
        run: |
          vcpkg install glew pthreads --triplet x64-windows
        env:
          VCPKG_MAX_CONCURRENCY: 4

      # ── Configure ──
      # Prepend the libcvc-deps prefix to CMAKE_PREFIX_PATH when the
      # bundle was fetched, so find_package picks up bundled Boost/Qt6/
      # FFTW/etc. ahead of any system installs.
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: |
          extra_prefix="${{ steps.libcvc-deps.outputs.path }}"
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DUSE_QT6=ON \
            -DDISABLE_CGAL=ON \
            -DCMAKE_PREFIX_PATH="$extra_prefix" \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/_install

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: |
          extra_prefix="${{ steps.libcvc-deps.outputs.path }}"
          combined_prefix="$extra_prefix${CMAKE_PREFIX_PATH:+;$CMAKE_PREFIX_PATH}"
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DUSE_QT6=ON \
            -DDISABLE_CGAL=ON \
            -DCMAKE_PREFIX_PATH="$combined_prefix" \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/_install

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          $depsPath = '${{ steps.libcvc-deps.outputs.path }}'
          $prefix = if ($depsPath) { "$depsPath;$env:Qt6_DIR" } else { "$env:Qt6_DIR" }
          cmake -B build `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_PREFIX_PATH="$prefix" `
            -DUSE_QT6=ON `
            -DDISABLE_CGAL=ON `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/_install"

      # ── Build ──
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      # ── Test ──
      # VolumeRover does not currently have a formal test suite.
      # When tests are added, enable the step below.
      # - name: Run tests
      #   run: ctest --test-dir build --build-config ${{ matrix.build_type }} --output-on-failure --parallel

      # ── Install ──
      - name: Install
        run: cmake --install build --config ${{ matrix.build_type }}

      # ── Package ──
      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nsis -y

      - name: Package (Windows)
        if: runner.os == 'Windows'
        working-directory: build
        shell: pwsh
        run: |
          $nsisPath = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\NSIS' -ErrorAction SilentlyContinue).'(default)'
          if (-not $nsisPath) {
            $nsisPath = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\WOW6432Node\NSIS' -ErrorAction SilentlyContinue).'(default)'
          }
          if ($nsisPath) {
            $env:PATH = "$nsisPath;$env:PATH"
          }
          cpack -G NSIS -C ${{ matrix.build_type }}
          cpack -G ZIP -C ${{ matrix.build_type }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        working-directory: build
        run: cpack -G ${{ matrix.package_generator }} -C ${{ matrix.build_type }} -D CPACK_DEBIAN_PACKAGE_SHLIBDEPS=OFF

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}-${{ matrix.build_type }}
          path: |
            build/*.deb
            build/*.dmg
            build/*.exe
            build/*.zip
            build/*.tar.gz
          retention-days: 30

      # ── Build artifact (installed tree) ──
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}-${{ matrix.build_type }}
          path: ${{ github.workspace }}/_install/
          retention-days: 14
