name: CI/CD

on:
  pull_request:
    branches: [ main, master, develop ]
  push:
    branches: [ main, master ]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - os: ubuntu-latest
            build_type: Debug
            package_generator: DEB
          - os: ubuntu-latest
            build_type: Release
            package_generator: DEB
          # macOS
          - os: macos-latest
            build_type: Debug
            package_generator: DragNDrop
          - os: macos-latest
            build_type: Release
            package_generator: DragNDrop
          # Windows — Release only. Its deps come from the cvcpkg catalog, which
          # ships Release (shared) bundles; a Debug app linked against Release
          # deps is an MSVC CRT mismatch, so (like publish-cvcpkg.yml) Windows
          # builds Release only.
          - os: windows-latest
            build_type: Release
            package_generator: NSIS

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / ${{ matrix.build_type }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Linux dependencies ──
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            qt6-base-dev \
            libqt6opengl6-dev \
            qt6-base-private-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libglew-dev \
            libboost-all-dev \
            libfftw3-dev \
            libgsl-dev \
            liblog4cplus-dev \
            libnsl-dev \
            imagemagick \
            libmagick++-dev

      # ── macOS dependencies ──
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install \
            cmake \
            ninja \
            qt@6 \
            glew \
            boost \
            fftw \
            gsl \
            log4cplus \
            imagemagick
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@6);$(brew --prefix boost);$(brew --prefix log4cplus)" >> $GITHUB_ENV

      # ── Windows dependencies (from the cvcpkg.org catalog — NO vcpkg) ──
      # Qt6, Boost, GLEW, FFTW3, GSL, log4cplus, ImageMagick and pthreads4w all
      # come from the cvcpkg prefix, via the same cvc-requirements.yaml + flow
      # publish-cvcpkg.yml already uses. This deliberately drops vcpkg: vcpkg's
      # log4cplus does not compile with MSVC 14.44 (win32fstream.h), while the
      # cvcpkg build (log4cplus 2.1.2+cvc) does, and cvcpkg is the project's
      # single source of third-party deps.
      - name: Install dependencies (cvcpkg)
        id: deps
        if: runner.os == 'Windows'
        uses: transfix/libcvc-deps/.github/actions/cvcpkg-install@master
        with:
          requirements: cvc-requirements.yaml
          build_type: Release
          link: shared

      # The composite action installs cvcpkg from a sparse checkout that excludes
      # recipes/. Reinstall the full package so the bundled recipes are present
      # for the GLEW source-fallback below.
      - name: Install cvcpkg (full, with bundled recipes)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          pip install --force-reinstall --no-deps 'git+https://github.com/transfix/libcvc-deps@master'
          cvcpkg --version

      # GLEW has a published bundle for linux/x86_64 only so far; build it from
      # its recipe into the same prefix on Windows.
      - name: Ensure GLEW (source fallback where no bundle exists yet)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          deps_prefix="${{ steps.deps.outputs.path }}"
          [ -n "$deps_prefix" ] || { echo "cvcpkg dependency prefix missing — provisioning failed earlier"; exit 1; }
          cvcpkg install glew \
            --prefix "$deps_prefix" \
            --platform windows \
            --config release \
            --link shared \
            --fallback-to-source

      # ── Configure ──
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DUSE_QT6=ON \
            -DDISABLE_CGAL=ON \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/_install

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DUSE_QT6=ON \
            -DDISABLE_CGAL=ON \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/_install

      # No vcpkg toolchain and no install-qt-action: the ONLY third-party search
      # path is the cvcpkg prefix (Qt6, Boost, GLEW, FFTW3, GSL, log4cplus,
      # ImageMagick, pthreads4w all resolve from it).
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $depsPath = '${{ steps.deps.outputs.path }}'
          if (-not $depsPath) { $depsPath = 'D:\libcvc-deps' }
          $env:PKG_CONFIG_PATH = "$depsPath\lib\pkgconfig"
          cmake -B build `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DCMAKE_CONFIGURATION_TYPES=${{ matrix.build_type }} `
            -DCMAKE_PREFIX_PATH="$depsPath" `
            -DUSE_QT6=ON `
            -DDISABLE_CGAL=ON `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/_install"

      # ── Build ──
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      # ── Test ──
      # VolumeRover does not currently have a formal test suite.
      # When tests are added, enable the step below.
      # - name: Run tests
      #   run: ctest --test-dir build --build-config ${{ matrix.build_type }} --output-on-failure --parallel

      # ── Install ──
      - name: Install
        run: cmake --install build --config ${{ matrix.build_type }}

      # ── Package ──
      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nsis -y

      - name: Package (Windows)
        if: runner.os == 'Windows'
        working-directory: build
        shell: pwsh
        run: |
          $nsisPath = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\NSIS' -ErrorAction SilentlyContinue).'(default)'
          if (-not $nsisPath) {
            $nsisPath = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\WOW6432Node\NSIS' -ErrorAction SilentlyContinue).'(default)'
          }
          if ($nsisPath) {
            $env:PATH = "$nsisPath;$env:PATH"
          }
          cpack -G NSIS -C ${{ matrix.build_type }}
          cpack -G ZIP -C ${{ matrix.build_type }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        working-directory: build
        run: cpack -G ${{ matrix.package_generator }} -C ${{ matrix.build_type }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}-${{ matrix.build_type }}
          path: |
            build/*.deb
            build/*.dmg
            build/*.exe
            build/*.zip
            build/*.tar.gz
          retention-days: 30

      # ── Build artifact (installed tree) ──
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}-${{ matrix.build_type }}
          path: ${{ github.workspace }}/_install/
          retention-days: 14
