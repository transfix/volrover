# Publish VolumeRover packages to cvcpkg.org
#
# Triggered by version tags (v*) and manual dispatch. Builds the
# VolumeRover 2.0 application (recipe: recipes/volrover2) on
# Linux (x86_64 + experimental arm64), macOS (arm64 + experimental
# x86_64), and Windows (x86_64), packs each install into an archive
# with `cvcpkg pack --from-prefix`, and publishes to the `cvc`
# organization on cvcpkg.org (created if it doesn't exist yet).
#
# DEPENDENCY PROVISIONING: all third-party libraries come from the
# cvcpkg.org catalog, installed from recipes/volrover2's own dependency
# list by `cvcpkg install-deps` — NOT from apt/brew/vcpkg. On Linux that
# includes GL/GLU (libglvnd + glu) and, on Linux/macOS, cmake and ninja,
# so the volrover2 job installs nothing from the OS. On Windows the vcpkg toolchain
# file is deliberately NOT used: in libcvc it injected conflicting
# MSVC flags that crashed CL.exe (transfix/libcvc#103) — pointing
# CMAKE_PREFIX_PATH at the cvcpkg prefix is the whole story.
# VolumeRover's own ci.yml/release.yml stay apt/brew/vcpkg-based
# until this pipeline proves out (follow-up).
#
# A second, gated job builds the VolumeRover3 application (recipe:
# recipes/volrover3), which consumes libcvc as an external SDK. It runs
# only when dispatched with enable_volrover3=true, and takes its whole
# toolchain from the catalog the same way.
#
# The recipes also carry freebsd/openbsd/netbsd build-matrix entries;
# those are not built here (no hosted BSD runners) — they enable the
# cvcpkg remote-builder fleet (`cvcpkg builds submit --org cvc`).
# windows-arm64 is a follow-up; wasm is a long-shot aspiration.
#
# Requires two repository secrets:
#   CVCPKG_TOKEN       — publisher-role token for the cvc org
#   CVCPKG_SERVER_URL  — optional; defaults to https://cvcpkg.org
#
name: publish-cvcpkg

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and pack only; skip publish.'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      enable_volrover3:
        description: >-
          Also build/pack the volrover3 recipe (requires @cvc/libcvc and
          vtk on cvcpkg.org).
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

concurrency:
  group: publish-cvcpkg-${{ github.ref }}
  cancel-in-progress: false

env:
  CVCPKG_ORG: cvc
  CVCPKG_SERVER: ${{ secrets.CVCPKG_SERVER_URL || 'https://cvcpkg.org' }}

jobs:
  ensure-org:
    runs-on: ubuntu-latest
    env:
      CVCPKG_TOKEN: ${{ secrets.CVCPKG_TOKEN }}
    steps:
      - name: Ensure cvc org exists on cvcpkg.org
        if: env.CVCPKG_TOKEN != ''
        run: |
          set -euo pipefail
          server="${CVCPKG_SERVER%/}"
          slug="$CVCPKG_ORG"
          # POST /v1/orgs — 200 on create, 409 if it already exists.
          status=$(curl -sS -o /tmp/org.json -w '%{http_code}' \
            -X POST "$server/v1/orgs" \
            -H "Authorization: Bearer $CVCPKG_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{
              "slug": "cvc",
              "display_name": "Center for Computational Visualization",
              "description": "Official CVC-lab package publisher.",
              "homepage": "https://www.cs.utexas.edu/~bajaj/cvc/",
              "is_private": false
            }')
          if [ "$status" = "200" ] || [ "$status" = "201" ]; then
            echo "Created org $slug"
          elif [ "$status" = "409" ]; then
            echo "Org $slug already exists — OK"
          else
            echo "Org creation failed with HTTP $status:"
            cat /tmp/org.json
            exit 1
          fi

  # ── VolumeRover 2.0 (recipes/volrover2) ──────────────────────
  build-volrover2:
    needs: ensure-org
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 (glibc 2.35, the cvcpkg fleet floor), not
          # ubuntu-latest: a 24.04 build references GLIBC_2.38 and will not
          # start on 22.04. `cvcpkg pack --from-prefix` does not check the
          # floor, so -latest would publish it without complaint. Same pin
          # as libcvc's publish-cvcpkg.yml.
          - os: ubuntu-22.04
            platform: linux
            arch: x86_64
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            experimental: true
          # macos-15, not macos-14: GitHub no longer takes macos-14 jobs.
          # macos_min keeps the 14.0 floor the macos-14 image gave.
          - os: macos-15
            platform: macos
            arch: arm64
            macos_min: "14.0"
          # macos-13 was retired by GitHub on 2025-12-04; its jobs queued
          # for 24 h and were then cancelled. macos-15-intel is the
          # replacement and the last x86_64 macOS image (gone August 2027).
          - os: macos-15-intel
            platform: macos
            arch: x86_64
            macos_min: "14.0"
            experimental: true
          - os: windows-latest
            platform: windows
            arch: x86_64
    continue-on-error: ${{ matrix.experimental == true }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # cvcpkg lives in cy-pca/cvcpkg; transfix/libcvc-deps is archived and
      # frozen at cvcpkg 2.2.1.
      #
      # [publish] is REQUIRED, not decoration: cvcpkg's core install is
      # click + PyYAML only, and everything that speaks to a cvcpkg server
      # over HTTP lives behind an extra named for its entry point. This job
      # runs `cvcpkg publish` below, which needs httpx, and only the extra
      # pulls it in. PEP 508 direct reference: the bracket goes on the NAME,
      # before the `@ <url>`.
      - name: Install cvcpkg
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install 'cvcpkg[publish] @ git+https://github.com/cy-pca/cvcpkg@master'
          cvcpkg --version

      # ── Dependencies from the cvcpkg.org catalog ──
      # The recipe is the single source of truth: `install-deps` installs
      # recipes/volrover2's runtime deps transitively and honours their
      # `platforms:` scopes (pthreads4w on Windows only, glu on Linux only).
      # Libraries come from the catalog on every platform, GL/GLU included
      # (libglvnd + glu) on Linux, so nothing is apt/brew-installed.
      # Linux/macOS also take cmake + ninja from it (--include-host-tools).
      # Windows keeps the runner's cmake: the catalog's cmake 3.31 has no
      # generator for the image's Visual Studio 2026.
      #
      # Always Release deps, even for future debug VolumeRover builds (the
      # libcvc pattern): the catalog's debug coverage is partial, and shared
      # Release deps are ABI-stable to link a Debug app against on
      # Linux/macOS.
      - name: Install dependencies (cvcpkg)
        id: deps
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "windows" ]; then
            prefix="D:/libcvc-deps"
            host_tools=()
          else
            prefix="$HOME/libcvc-deps"
            host_tools=(--include-host-tools)
          fi
          cvcpkg install-deps recipes/volrover2 \
            --prefix "$prefix" \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --config release \
            --link shared \
            ${host_tools[@]+"${host_tools[@]}"}
          echo "path=$prefix" >> "$GITHUB_OUTPUT"

      # ── Configure ──
      # VOLROVER_RELEASE=ON gives a clean version string; BUILD_VOLROVER3
      # stays OFF here. The ONLY third-party search path is the cvcpkg
      # prefix. HDF5 and GLUT are optional finds that nothing in the
      # package needs; turning them off keeps whatever the runner image
      # happens to ship out of the bundle.
      - name: Configure (Linux/macOS)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          deps_prefix="${{ steps.deps.outputs.path }}"
          # Magick++-config (queried at configure time for ImageMagick 7
          # defines) resolves its flags through pkg-config.
          export PKG_CONFIG_PATH="$deps_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          extra=()
          if [ -n "${{ matrix.macos_min }}" ]; then
            extra+=(-DCMAKE_OSX_DEPLOYMENT_TARGET="${{ matrix.macos_min }}")
          fi
          "$deps_prefix/bin/cmake" -B build -G Ninja \
            -DCMAKE_MAKE_PROGRAM="$deps_prefix/bin/ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DVOLROVER_RELEASE=ON \
            -DUSE_QT6=ON \
            -DDISABLE_CGAL=ON \
            -DBUILD_VOLROVER3=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_HDF5=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_GLUT=ON \
            -DCMAKE_PREFIX_PATH="$deps_prefix" \
            -DCMAKE_INSTALL_PREFIX="$PWD/stage" \
            ${extra[@]+"${extra[@]}"}

      # No vcpkg toolchain file and no install-qt-action: Qt6, Boost,
      # GLEW, FFTW3, GSL, log4cplus, ImageMagick, and pthreads4w all
      # come from the cvcpkg prefix. (find_package(PThreads4W) is
      # served by CMake/FindPThreads4W.cmake against that prefix.)
      - name: Configure (Windows)
        if: matrix.platform == 'windows'
        run: |
          $depsPath = '${{ steps.deps.outputs.path }}'
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CONFIGURATION_TYPES=Release `
            -DVOLROVER_RELEASE=ON `
            -DUSE_QT6=ON `
            -DDISABLE_CGAL=ON `
            -DBUILD_VOLROVER3=OFF `
            -DCMAKE_DISABLE_FIND_PACKAGE_HDF5=ON `
            -DCMAKE_DISABLE_FIND_PACKAGE_GLUT=ON `
            -DCMAKE_PREFIX_PATH="$depsPath" `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/stage"

      - name: Build & install
        shell: bash
        run: |
          set -euo pipefail
          cmake=cmake
          if [ "${{ matrix.platform }}" != "windows" ]; then
            cmake="${{ steps.deps.outputs.path }}/bin/cmake"
          fi
          "$cmake" --build build --parallel --config Release
          "$cmake" --install build --config Release

      - name: Pack archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cvcpkg pack recipes/volrover2 \
            --from-prefix stage \
            --platform "${{ matrix.platform }}" \
            --config release \
            --link shared \
            --local \
            --output-dir dist

      - name: Upload packed archive
        uses: actions/upload-artifact@v4
        with:
          name: cvcpkg-volrover2-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/
          retention-days: 14

      - name: Publish to cvcpkg.org
        if: github.event_name == 'push' || github.event.inputs.dry_run == 'false'
        shell: bash
        env:
          CVCPKG_TOKEN: ${{ secrets.CVCPKG_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CVCPKG_TOKEN:-}" ]; then
            echo "CVCPKG_TOKEN secret is required to publish"
            exit 1
          fi
          cvcpkg publish \
            volrover2 \
            --server "$CVCPKG_SERVER" \
            --org "$CVCPKG_ORG" \
            --platform "${{ matrix.platform }}" \
            --config release \
            --link shared \
            --output-dir dist \
            --token "$CVCPKG_TOKEN"

  # ── VolumeRover3 (recipes/volrover3) — GATED ─────────────────
  #
  # volrover3 consumes libcvc as an external SDK (find_package(cvc
  # CONFIG) -> cvc::cvc) plus VTK, both from the cvcpkg.org catalog.
  # This job only runs when manually dispatched with enable_volrover3=true,
  # and is continue-on-error so it can never block a VolumeRover 2.0
  # release.
  #
  # Catalog coverage (2026-11-08): linux x86_64/arm64 and windows have the
  # whole closure. macos/arm64 lacks cvcgl, pycvc-cp311, pycvc-gl-cp311,
  # pyside6-cp311 and shiboken6-cp311 (macos/x86_64 also lacks vtk), so the
  # macOS lanes stop at dependency install until libcvc publishes them.
  build-volrover3:
    needs: ensure-org
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.enable_volrover3 == 'true'
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # Runner pins: see the volrover2 matrix. ubuntu-latest (24.04)
          # published volrover3 3.2.4+cvc.3 referencing GLIBC_2.38, which
          # does not start on 22.04 (fleet floor 2.35).
          - os: ubuntu-22.04
            platform: linux
            arch: x86_64
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            experimental: true
          - os: macos-15
            platform: macos
            arch: arm64
            macos_min: "14.0"
          - os: macos-15-intel
            platform: macos
            arch: x86_64
            macos_min: "14.0"
          - os: windows-latest
            platform: windows
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cvcpkg
        shell: bash
        run: |
          set -euo pipefail
          # [publish] is REQUIRED, not decoration: cvcpkg's core install is
          # click + PyYAML only, and everything that speaks to a cvcpkg
          # server over HTTP now lives behind an extra named for its entry
          # point. This job runs `cvcpkg publish` (volrover3) below, which
          # needs httpx — only the extra pulls it in. PEP 508 direct
          # reference: the bracket goes on the NAME, before the `@ <url>`.
          python -m pip install --upgrade pip
          pip install 'cvcpkg[publish] @ git+https://github.com/cy-pca/cvcpkg@master'
          cvcpkg --version

      # Everything comes from the catalog; nothing is apt/brew/vcpkg-installed.
      # The top-level CMakeLists configures the whole VolumeRover 2.0 tree even
      # when only volrover3 is built, so the prefix gets recipes/volrover2's
      # closure (Boost, FFTW, GSL, log4cplus, GLEW, ImageMagick, GLU on Linux,
      # pthreads4w on Windows) as well as recipes/volrover3's own: libcvc /
      # cvcgl (cvcgl pulls in imgui) / vtk / qt6 / yaml-cpp / glew, plus
      # python311 (the embedded CPython the CMakeLists hermeticity guard pins
      # to this prefix) and the pycvc / pycvc-gl / pyside6 / shiboken6 runtime
      # closure. Driving both from the recipes keeps them the single source of
      # truth; a hand-kept `cvcpkg install <list>` is how cvcgl, yaml-cpp,
      # python311 and imgui each went missing here in turn. Linux/macOS also
      # take cmake + ninja from the catalog; Windows keeps the runner's cmake
      # (the catalog's 3.31 has no generator for Visual Studio 2026).
      - name: Install dependencies (cvcpkg)
        id: deps
        shell: bash
        run: |
          set -euo pipefail
          export CVCPKG_SERVER_URL="$CVCPKG_SERVER"
          prefix="$GITHUB_WORKSPACE/cvc-deps"
          host_tools=()
          if [ "${{ matrix.platform }}" != "windows" ]; then
            host_tools=(--include-host-tools)
          fi
          for recipe in recipes/volrover2 recipes/volrover3; do
            cvcpkg install-deps "$recipe" \
              --prefix "$prefix" \
              --platform "${{ matrix.platform }}" \
              --arch "${{ matrix.arch }}" \
              --config release \
              --link shared \
              ${host_tools[@]+"${host_tools[@]}"}
          done
          echo "path=$prefix" >> "$GITHUB_OUTPUT"

      # GLUT is an optional find nothing here uses; turning it off keeps the
      # runner image out of the build. HDF5 stays on: libcvc's CMake config
      # needs it, and it comes from the prefix.
      - name: Configure (Linux/macOS)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          deps_prefix="${{ steps.deps.outputs.path }}"
          # Magick++-config (queried at configure time for ImageMagick 7
          # defines) resolves its flags through pkg-config.
          export PKG_CONFIG_PATH="$deps_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          extra=()
          if [ -n "${{ matrix.macos_min }}" ]; then
            extra+=(-DCMAKE_OSX_DEPLOYMENT_TARGET="${{ matrix.macos_min }}")
          fi
          "$deps_prefix/bin/cmake" -B build -G Ninja \
            -DCMAKE_MAKE_PROGRAM="$deps_prefix/bin/ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DVOLROVER_RELEASE=ON \
            -DUSE_QT6=ON \
            -DDISABLE_CGAL=ON \
            -DBUILD_VOLROVER3=ON \
            -DVOLROVER3_BUILD_TESTS=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_GLUT=ON \
            -DCMAKE_PREFIX_PATH="$deps_prefix" \
            -DCMAKE_INSTALL_PREFIX="$PWD/stage" \
            ${extra[@]+"${extra[@]}"}

      # No vcpkg toolchain file and no install-qt-action: Qt6, Boost, GLEW,
      # FFTW3, GSL, log4cplus, ImageMagick and pthreads4w come from the cvcpkg
      # prefix, as in the volrover2 job.
      - name: Configure (Windows)
        if: matrix.platform == 'windows'
        run: |
          $depsPath = '${{ steps.deps.outputs.path }}'
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CONFIGURATION_TYPES=Release `
            -DVOLROVER_RELEASE=ON `
            -DCMAKE_PREFIX_PATH="$depsPath" `
            -DPython3_EXECUTABLE="$depsPath\python.exe" `
            -DPython3_ROOT_DIR="$depsPath" `
            -DPython3_FIND_STRATEGY=LOCATION `
            -DUSE_QT6=ON `
            -DDISABLE_CGAL=ON `
            -DBUILD_VOLROVER3=ON `
            -DVOLROVER3_BUILD_TESTS=OFF `
            -DCMAKE_DISABLE_FIND_PACKAGE_GLUT=ON `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/stage"

      # Build only the volrover3 target; stage only its install
      # component so the packed prefix is exactly the volrover3 app
      # tree. The install-time --prefix override also sidesteps the
      # macOS quirk where the top-level project appends
      # VolumeRover-<ver>.app/Contents to the configured prefix.
      - name: Build & install (volrover3 component)
        shell: bash
        run: |
          set -euo pipefail
          cmake=cmake
          if [ "${{ matrix.platform }}" != "windows" ]; then
            cmake="${{ steps.deps.outputs.path }}/bin/cmake"
          fi
          "$cmake" --build build --parallel --config Release --target volrover3
          "$cmake" --install build --config Release --component volrover3 --prefix "$PWD/stage"

      - name: Pack archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cvcpkg pack recipes/volrover3 \
            --from-prefix stage \
            --platform "${{ matrix.platform }}" \
            --config release \
            --link shared \
            --local \
            --output-dir dist

      - name: Upload packed archive
        uses: actions/upload-artifact@v4
        with:
          name: cvcpkg-volrover3-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/
          retention-days: 14

      - name: Publish to cvcpkg.org
        if: github.event.inputs.dry_run == 'false'
        shell: bash
        env:
          CVCPKG_TOKEN: ${{ secrets.CVCPKG_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CVCPKG_TOKEN:-}" ]; then
            echo "CVCPKG_TOKEN secret is required to publish"
            exit 1
          fi
          cvcpkg publish \
            volrover3 \
            --server "$CVCPKG_SERVER" \
            --org "$CVCPKG_ORG" \
            --platform "${{ matrix.platform }}" \
            --config release \
            --link shared \
            --output-dir dist \
            --token "$CVCPKG_TOKEN"
